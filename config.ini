[settings]
# Network and media selection
port = 9696
max_height = 1080
max_fps = 30
segment_seconds = 6
startup_wait = 10

# Runtime cache
cache_max_size = 10G
cache_grace_minutes = 10
cache_cleanup_interval = 300
job_idle_timeout = 30
cache_dir = cache

# External tools and optional cookies
# Change these two paths on Windows, for example:
# yt_dlp = C:\Tools\yt-dlp\yt-dlp.exe
# ffmpeg = C:\ffmpeg\bin\ffmpeg.exe
yt_dlp = ~/.local/bin/yt-dlp
ffmpeg = /usr/bin/ffmpeg
cookies = youtube_cookies.txt

# VRChat interception. Empty values use automatic discovery/defaults.
vrchat_yt_dlp =
stub = yt-dlp-stub/publish/yt-dlp-stub.exe
backup =

log_level = INFO
